<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Subtle Glowing Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="20" opacity="0.85" />
  
  <!-- Content: < C . B /> -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central">
    <!-- Left Bracket -->
    <text x="120" y="256" font-size="160" fill="url(#bracketGrad)">&lt;</text>
    
    <!-- Initials C -->
    <text x="215" y="256" font-size="140" fill="#f3f4f6">C</text>
    
    <!-- Accent Dot -->
    <circle cx="260" cy="290" r="16" fill="#f59e0b" />
    
    <!-- Initials B -->
    <text x="305" y="256" font-size="140" fill="#f3f4f6">B</text>
    
    <!-- Right Slash Bracket -->
    <text x="400" y="256" font-size="160" fill="url(#bracketGrad)">/&gt;</text>
  </g>
</svg>
